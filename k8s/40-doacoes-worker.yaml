apiVersion: apps/v1
kind: Deployment
metadata:
  name: doacoes-worker
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doacoes-worker
  template:
    metadata:
      labels:
        app: doacoes-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: worker
          image: conexao-solidaria/doacoes-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: doacoes-worker
  namespace: conexao-solidaria
spec:
  selector:
    app: doacoes-worker
  ports:
    - port: 8081
      targetPort: 8081
