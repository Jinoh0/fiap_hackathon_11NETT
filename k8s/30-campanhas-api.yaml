apiVersion: apps/v1
kind: Deployment
metadata:
  name: campanhas-api
  namespace: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campanhas-api
  template:
    metadata:
      labels:
        app: campanhas-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: conexao-solidaria/campanhas-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: campanhas-api
  namespace: conexao-solidaria
spec:
  type: NodePort
  selector:
    app: campanhas-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
