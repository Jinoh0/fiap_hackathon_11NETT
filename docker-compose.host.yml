# Use when Docker bridge networking is blocked (some CI/cloud sandboxes):
#   docker compose -f docker-compose.host.yml up --build -d
services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: conexao
      POSTGRES_PASSWORD: conexao123
      POSTGRES_DB: conexao_campanhas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U conexao -d conexao_campanhas"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    network_mode: host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Campanhas.Api/Dockerfile
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:43123
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=conexao_campanhas;Username=conexao;Password=conexao123
      RabbitMQ__Host: 127.0.0.1
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Jwt__Key: ConexaoSolidaria_SuperSecret_Key_ChangeInProd_32+
      Jwt__Issuer: conexao-solidaria
      Jwt__Audience: conexao-solidaria-clients
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/Doacoes.Worker/Dockerfile
    network_mode: host
    environment:
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=conexao_campanhas;Username=conexao;Password=conexao123
      RabbitMQ__Host: 127.0.0.1
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      Metrics__Port: "8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    network_mode: host
    volumes:
      - ./observability/prometheus.host.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:11.2.0
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./observability/grafana/provisioning.host:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
